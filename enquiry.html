<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <meta name="description"
      content="Enquire about professional puppy training, dog obedience and behaviour training at Pawsitive Obedience Academy. Find the right training programme for your dog.">

    <title>Enquire About Dog Training | Pawsitive Obedience Academy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav class="navbar">

            <div class="logo">
               <img src="images/logo.png" alt="Pawsitive Obedience Academy logo">
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about-us.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>
    </header>

    <main>

        <section class="page-header">
            <h1>Make an Enquiry</h1>

            <p>
                Tell us about you and your dog and we'll help you
                find the right training programme.
            </p>
        </section>


        <section class="form-section">

            <form id="enquiryForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                   <input type="text"
                          id="fullName"
                          name="fullName"
                          minlength="2"
                          maxlength="60"
                          required>
                </div>


                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email"
                           id="email"
                           name="email"
                           required>
                </div>


                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input type="tel"
       id="phone"
       name="phone"
       pattern="[0-9+\s()-]{10,20}"
       title="Enter a valid phone number."
       required>
                </div>


                <div class="form-group">
                    <label for="dogName">Dog's Name</label>

                    <input type="text"
                           id="dogName"
                           name="dogName"
                           required>
                </div>


                <div class="form-group">
                    <label for="dogAge">Dog's Age</label>

                   <input type="number"
       id="dogAge"
       name="dogAge"
       min="0"
       max="30"
       step="1"
       required>
                </div>


                <div class="form-group">
                    <label for="service">Training Service</label>

                    <select id="service"
                            name="service"
                            required>

                        <option value="">Select a service</option>
                        <option value="puppy">Puppy Training</option>
                        <option value="basic">Basic Obedience</option>
                        <option value="advanced">Advanced Training</option>
                        <option value="behaviour">Behaviour Training</option>

                    </select>
                </div>


                <div class="form-group">
    <label for="message">Message</label>

    <textarea id="message"
              name="message"
              rows="6"
              minlength="10"
              maxlength="1000"
              required></textarea>
</div>


                <button type="submit" class="btn">
                    Submit Enquiry
                </button>

                <p id="formMessage" class="form-message"></p>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Pawsitive Obedience Academy. All Rights Reserved.</p>
        <p>Professional Canine Training &amp; Obedience</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
